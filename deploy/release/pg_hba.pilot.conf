# Encrypted inter-host transport is provided by wg-elwids.
# Replace __APP_TUNNEL_ADDRESS__ with the verified application peer IPv4 address.
local all all trust
host iot iot_api __APP_TUNNEL_ADDRESS__/32 scram-sha-256
host iot iot_runtime __APP_TUNNEL_ADDRESS__/32 scram-sha-256
host all postgres __APP_TUNNEL_ADDRESS__/32 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::/0 reject
