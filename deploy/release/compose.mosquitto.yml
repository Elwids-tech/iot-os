# Selected explicitly by manage.py. Legacy environments stay on EMQX.
services:
  container-metrics:
    environment:
      EXPECTED_SERVICES: ${BROKER_EXPECTED_SERVICES:?}
  emqx:
    profiles: [legacy-broker]
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    restart: unless-stopped
    ports: ["8883:8883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${STATE_DIR}/mqtt-certs:/mosquitto/certs:ro
      - ${STATE_DIR}/mosquitto:/mosquitto/data
    networks:
      private:
        aliases: ["mqtt.${DOMAIN}"]
    mem_limit: 128m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  broker-admin:
    image: ${RUNTIME_IMAGE:?}
    entrypoint: [/broker-admin]
    restart: unless-stopped
    environment:
      DEVICE_BROKER_ADMIN_TOKEN: ${DEVICE_BROKER_ADMIN_TOKEN:?}
      BROKER_ADDRESS: ssl://mqtt.${DOMAIN}:8883
      BROKER_TLS_SERVER_NAME: mqtt.${DOMAIN}
      BROKER_ADMIN_USERNAME: elwids-admin
      BROKER_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?}
    networks: [private]
    mem_limit: 48m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
