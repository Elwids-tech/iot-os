# Applied by manage.py when DATABASE_HOST is a private IPv4 address.
# The host must route that address through the verified WireGuard tunnel.
services:
  timescaledb:
    profiles: [local-database]
  db-client:
    image: timescale/timescaledb:2.29.2-pg17
    profiles: [tools]
    restart: "no"
    networks: [private]
    environment:
      PGHOST: ${DATABASE_HOST:?}
      PGPORT: "5432"
      PGDATABASE: iot
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGCONNECT_TIMEOUT: "5"
    entrypoint: []
    command: [psql, -v, ON_ERROR_STOP=1, -c, SELECT 1]
    mem_limit: 128m
