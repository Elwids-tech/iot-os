services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    environment: &api-environment
      APP_NAME: IoT OS API
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${IOT_API_APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      APP_URL: "http://127.0.0.1:${IOT_API_PORT:-8001}"
      FRONTEND_URL: ${IOT_PORTAL_URL:-http://127.0.0.1:5173}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_DATABASE: ${IOT_POSTGRES_DATABASE:-iot_os}
      DB_USERNAME: ${IOT_POSTGRES_USER:-iot_os}
      DB_PASSWORD: ${IOT_POSTGRES_PASSWORD:-iot_os_dev_only}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      IOT_WEBHOOK_ALLOWED_HOSTS: ${IOT_WEBHOOK_ALLOWED_HOSTS:-}
      IOT_WEBHOOK_LOCAL_SINK_ENABLED: ${IOT_WEBHOOK_LOCAL_SINK_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_STORE: "false"
      IOT_ASSISTANT_ENABLED: ${IOT_ASSISTANT_ENABLED:-false}
      IOT_ASSISTANT_MODEL: ${IOT_ASSISTANT_MODEL:-gpt-5.4-mini-2026-03-17}
      IOT_ASSISTANT_DAILY_BUDGET_USD: ${IOT_ASSISTANT_DAILY_BUDGET_USD:-0.50}
      IOT_ASSISTANT_RUN_BUDGET_USD: ${IOT_ASSISTANT_RUN_BUDGET_USD:-0.04}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@iot-os.test
      MAIL_FROM_NAME: IoT OS
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:${IOT_PORTAL_PORT:-5173},127.0.0.1:${IOT_PORTAL_PORT:-5173},localhost:${IOT_ADMIN_PORT:-5174},localhost:5175,127.0.0.1,127.0.0.1:${IOT_ADMIN_PORT:-5174},127.0.0.1:5175
      CORS_ALLOWED_ORIGINS: http://localhost:${IOT_PORTAL_PORT:-5173},http://127.0.0.1:${IOT_PORTAL_PORT:-5173},http://localhost:${IOT_ADMIN_PORT:-5174},http://localhost:5175,http://127.0.0.1:${IOT_ADMIN_PORT:-5174},http://127.0.0.1:5175
    volumes:
      - assistant-private:/var/www/html/storage/app/private/assistant
    ports:
      - "${IOT_API_PORT:-8001}:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - internal

  automation-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    environment: *api-environment
    command: ["php", "artisan", "automation:work", "--max-time=3600"]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  webhooks-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    environment: *api-environment
    command: ["php", "artisan", "integrations:webhooks-work", "--max-time=3600"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
    networks:
      - internal

  alerts-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    environment:
      <<: *api-environment
    command: ["php", "artisan", "queue:work", "alerts", "--queue=alerts", "--sleep=1", "--timeout=30", "--max-time=3600"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped
    networks:
      - internal

  assistant-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/api/Dockerfile
    environment:
      <<: *api-environment
    command: ["php", "artisan", "queue:work", "assistant", "--queue=assistant", "--sleep=1", "--tries=1", "--timeout=120", "--max-time=3600"]
    volumes:
      - assistant-private:/var/www/html/storage/app/private/assistant
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 135s
    restart: unless-stopped
    networks:
      - internal

  admin:
    build:
      context: ../..
      dockerfile: deploy/docker/admin/Dockerfile
      args:
        VITE_API_URL: ${IOT_API_URL:-http://127.0.0.1:8001}
        VITE_PORTAL_URL: ${IOT_PORTAL_URL:-}
    ports:
      - "${IOT_ADMIN_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  portal:
    build:
      context: ../..
      dockerfile: deploy/docker/portal/Dockerfile
      args:
        VITE_API_URL: ${IOT_API_URL:-http://127.0.0.1:8001}
        VITE_ADMIN_URL: ${IOT_ADMIN_URL:-http://127.0.0.1:5174}
        VITE_MAP_STYLE_URL: ${IOT_MAP_STYLE_URL:-}
    ports:
      - "${IOT_PORTAL_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  assistant-private:
