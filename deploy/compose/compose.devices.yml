services:
  nats:
    ports: !reset []
  emqx:
    ports: !override
      - "${IOT_MQTTS_PORT:-8883}:8883"
      - "127.0.0.1:${IOT_EMQX_DASHBOARD_PORT}:18083"
    volumes:
      - ./emqx.devices.conf:/opt/emqx/etc/emqx.conf:ro
      - ${DEVICE_CERT_DIR:?Run the device setup command first}/ca.crt:/opt/emqx/etc/device-certs/ca.crt:ro
      - ${DEVICE_CERT_DIR}/server.crt:/opt/emqx/etc/device-certs/server.crt:ro
      - ${DEVICE_CERT_DIR}/server.key:/opt/emqx/etc/device-certs/server.key:ro
      - ${DEVICE_CERT_DIR}/api-keys:/opt/emqx/etc/device-certs/api-keys:ro
  api:
    environment:
      DEVICE_RUNTIME_URL: http://runtime:8081
      DEVICE_RUNTIME_TOKEN: ${DEVICE_RUNTIME_TOKEN:?Generate a private runtime token}
      DEVICE_MQTT_URL: ssl://emqx:8883
      DEVICE_EMQX_API_URL: http://emqx:18083/api/v5
      DEVICE_EMQX_API_KEY: ${DEVICE_EMQX_API_KEY:?Generate a broker API key}
      DEVICE_EMQX_API_SECRET: ${DEVICE_EMQX_API_SECRET:?Generate a broker API secret}
  automation-worker:
    environment:
      DEVICE_RUNTIME_URL: http://runtime:8081
      DEVICE_RUNTIME_TOKEN: ${DEVICE_RUNTIME_TOKEN}

  runtime:
    build:
      context: ../..
      dockerfile: deploy/docker/runtime/Dockerfile
    environment:
      DEVICE_RUNTIME_TOKEN: ${DEVICE_RUNTIME_TOKEN}
      DEVICE_CONTROL_URL: http://api:8000/api/internal/devices
      DEVICE_DATABASE_URL: postgres://${IOT_POSTGRES_USER}:${IOT_POSTGRES_PASSWORD}@timescaledb:5432/${IOT_POSTGRES_DATABASE}?sslmode=disable
      DEVICE_MQTT_CA_FILE: /certs/ca.crt
      NATS_URL: nats://nats:4222
    volumes:
      - ${DEVICE_CERT_DIR}/ca.crt:/certs/ca.crt:ro
    depends_on:
      api:
        condition: service_healthy
      nats:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - internal
      - device
    restart: unless-stopped
