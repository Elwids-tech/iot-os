services:
  timescaledb:
    image: timescale/timescaledb:2.29.2-pg17
    environment:
      POSTGRES_DB: iot_devices_test
      POSTGRES_USER: devices_test
      POSTGRES_PASSWORD: ${DEVICE_TEST_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${DEVICE_TEST_PG_PORT:-55435}:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U devices_test -d iot_devices_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  mqtt-init:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    entrypoint:
      - /bin/sh
      - -c
      - test -f /mosquitto/data/dynamic-security.json || mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json iot-admin "$$MOSQUITTO_ADMIN_PASSWORD"; chown -R 1883:1883 /mosquitto/data
    environment:
      MOSQUITTO_ADMIN_PASSWORD: ${MOSQUITTO_ADMIN_PASSWORD:?}
    volumes:
      - mosquitto-data:/mosquitto/data
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    ports:
      - "127.0.0.1:${DEVICE_TEST_MQTT_PORT:-18885}:8883"
    volumes:
      - ./mosquitto.devices.conf:/mosquitto/config/mosquitto.conf:ro
      - ${DEVICE_CERT_DIR:?}/server.crt:/mosquitto/certs/server.crt:ro
      - ${DEVICE_CERT_DIR:?}/server.key:/mosquitto/certs/server.key:ro
      - mosquitto-data:/mosquitto/data
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 8883"]
      interval: 2s
      timeout: 2s
      retries: 30
  nats:
    image: nats:2.14.5-alpine
    command: [--jetstream, --store_dir=/data]
    ports:
      - "127.0.0.1:${DEVICE_TEST_NATS_PORT:-14225}:4222"

volumes:
  mosquitto-data:
