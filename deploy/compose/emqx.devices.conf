node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
}
dashboard.listeners.http.bind = "0.0.0.0:18083"
listeners.tcp.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/device-certs/ca.crt"
    certfile = "/opt/emqx/etc/device-certs/server.crt"
    keyfile = "/opt/emqx/etc/device-certs/server.key"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}
authentication = [{ mechanism = password_based, backend = built_in_database, user_id_type = username }]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [{ type = built_in_database, enable = true }]
}
api_key.bootstrap_file = "/opt/emqx/etc/device-certs/api-keys"
