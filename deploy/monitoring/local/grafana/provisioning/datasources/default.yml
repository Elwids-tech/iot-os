apiVersion: 1
datasources:
- name: Metrics
  uid: prometheus
  type: prometheus
  url: http://prometheus:9090
  access: proxy
  isDefault: true
  jsonData:
    httpMethod: POST
- name: Logs
  uid: loki
  type: loki
  url: http://loki:3100
  access: proxy
  jsonData:
    manageAlerts: true
- name: Alertmanager
  uid: alertmanager
  type: alertmanager
  url: http://alertmanager:9093
  access: proxy
  jsonData:
    implementation: prometheus
    handleGrafanaManagedAlerts: false
