# The portal's own config (spec 033): the admin app keeps deploy/docker/admin/nginx.conf.
# A template: deploy/docker/portal/portal-addresses.sh fills the three @...@ values when
# the container starts and writes /etc/nginx/conf.d/default.conf.

# Whether the request's host is a billing account's portal address (spec 036, ADR-050)
# rather than the platform's own portal host. Empty, so always 0, while the deployment
# has portal addresses switched off: then nothing below changes anything.
# The scheme the browser used: the deployment's proxy says so; without one, this server's.
map $http_x_forwarded_proto $portal_forwarded_proto {
    default $scheme;
    https https;
}

map $host $portal_address {
    default 0;
@ADDRESS_HOSTS@
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's resolver, so the API is looked up per request and may restart freely.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "@API_UPSTREAM@";
    client_max_body_size @UPLOAD_LIMIT@;

    # Deployment settings, written when the container starts; never cached. On an
    # address the API answers instead, with that address's brand (research R9): this is
    # the first script the page runs, so the platform's name is never drawn there.
    location = /runtime-config.js {
        if ($portal_address) {
            rewrite ^ /api/v1/portal/runtime-config.js last;
        }
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Internal routes are never reachable through an address.
    location ~ ^/(api/internal|internal)(/|$) {
        if ($portal_address) {
            return 404;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # On an address the API is served on the same host (research R6), keeping the host
    # so the API knows which address asked. On the platform's own host these paths are
    # the app's, as before.
    location ~ ^/(api|sanctum)/ {
        if ($portal_address = 0) {
            rewrite ^ /index.html last;
        }
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
        proxy_set_header Connection "";
        # Streamed answers (spec 030) reach the browser as they are written.
        proxy_buffering off;
        proxy_read_timeout 3700s;
    }

    # The service worker and the web app manifest keep their names across releases, so
    # browsers revalidate them on every check. A missing one is a 404, never the app's
    # index.html, which a browser would try to install as a worker.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite fingerprints these file names, so they never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page where people approve AI agents (spec 004) must never be framed. The
    # service worker leaves it to nginx, so these headers always apply.
    location ~ ^/connect/?$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # index.html names the current build's assets; revalidate it on every load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
