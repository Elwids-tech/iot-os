server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these file names, so they never change in place.
    location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page where people approve AI agents (spec 004) must never be framed.
    location = /connect {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # index.html names the current build's assets; revalidate it on every load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
