; The local HTTP server otherwise reparses Laravel on every replayed event.
; Preserve timestamp checks for development; container rebuilds replace the cache.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; A telemetry stream may name 1000 devices as devices[] (spec 030): room for them and the rest of the query.
max_input_vars=2500
