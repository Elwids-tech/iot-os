; PHP-FPM pool for the release api image (spec 030, research R6). An application
; telemetry stream occupies one worker for up to an hour, so the pool holds
; IOT_STREAMS_MAX_OPEN (default 10) streams and still leaves 14 workers for requests;
; the api container's mem_limit (768 MiB in deploy/release/compose.yml) assumes about
; 25 MiB per worker. docs/ops/release.md has the arithmetic and how to raise the cap.
; request_terminate_timeout is off: a stream ends on its lifetime, its re-check or a
; shutdown, not on a timer. Loaded after www.conf (same pool name, later file).
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
request_terminate_timeout = 0
