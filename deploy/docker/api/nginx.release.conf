log_format request_json escape=json '{"service":"api-web","request_id":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout request_json;
    client_max_body_size 20m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_REQUEST_ID $request_id;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        # Re-resolve the container address after a stop/start or replacement.
        set $php_backend api:9000;
        fastcgi_pass $php_backend;
        fastcgi_read_timeout 150s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
