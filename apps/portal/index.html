<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>IoT OS</title>
    <script>
      // Skin and dark palette before first paint; SkinProvider and PaletteProvider
      // (packages/ui skin.tsx, palette.tsx) take over after load.
      try {
        var skin = localStorage.getItem("iot-skin")
        document.documentElement.dataset.skin =
          skin === "instrument" || skin === "flight-deck" ? skin : "console"
        var palette = localStorage.getItem("iot-palette")
        document.documentElement.dataset.palette = palette === "ink" ? "ink" : "dusk"
      } catch (error) {
        document.documentElement.dataset.skin = "console"
        document.documentElement.dataset.palette = "dusk"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
