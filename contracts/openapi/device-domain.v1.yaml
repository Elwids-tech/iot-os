openapi: 3.1.0
info:
  title: IoT OS Device Domain API v1
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Tenant-scoped control-plane API for canonical Device Profile and Native MQTT
    Binding authoring, logical Device lifecycle, exact definition assignments,
    Gateway identities, and Gateway Routes.
servers:
  - url: http://localhost:8000
    description: Local Laravel API
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Device Profiles v1
    description: Dynamic logical-Device semantic blueprints.
  - name: Native MQTT Bindings v1
    description: Parameter-UUID mappings, calibration, and Command encoding.
  - name: Definition compilation
    description: Fixture replay, coordinated publication, and Runtime Bundle pinning.
  - name: Devices
    description: Logical Device drafts, exact definition assignment, registration, and archival.
  - name: Gateways
    description: Authenticated MQTT communication identities.
  - name: Gateway Routes
    description: Gateway-to-logical-Device addressing and payload scopes.
paths:
  /api/v1/definition-compilations/preview:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    post:
      tags: [Definition compilation]
      summary: Preview saved Profile and Binding drafts in a proposed Gateway Route context
      operationId: previewDefinitionCompilationV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionCompileRequestV1'
      responses:
        '200':
          $ref: '#/components/responses/DefinitionPreviewResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/definition-compilations/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchProfile'
      - $ref: '#/components/parameters/IfMatchBinding'
    post:
      tags: [Definition compilation]
      summary: Compile and atomically publish a saved Profile and Binding draft pair
      operationId: publishDefinitionCompilationV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionCompileRequestV1'
      responses:
        '200':
          $ref: '#/components/responses/DefinitionPublicationResponse'
        '422':
          $ref: '#/components/responses/DefinitionCompileFailureResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/device-profiles:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    get:
      tags: [Device Profiles v1]
      summary: List Device Profile v1 drafts and published Versions
      operationId: listDeviceProfilesV1
      responses:
        '200':
          $ref: '#/components/responses/CollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Device Profiles v1]
      summary: Create a Device Profile v1 draft
      operationId: createDeviceProfileV1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceProfileAuthoringV1'
      responses:
        '201':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/device-profiles/{profile}:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/ProfileUuid'
    get:
      tags: [Device Profiles v1]
      summary: Get a Device Profile v1 aggregate
      operationId: getDeviceProfileV1
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Device Profiles v1]
      summary: Replace a Device Profile v1 draft at the expected revision
      operationId: replaceDeviceProfileV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceProfileAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Device Profiles v1]
      summary: Delete an unreferenced Device Profile v1 draft
      operationId: deleteDeviceProfileV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Draft deleted.
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/native-mqtt-bindings:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    get:
      tags: [Native MQTT Bindings v1]
      summary: List Native MQTT Binding v1 aggregates
      operationId: listNativeMqttBindingsV1
      responses:
        '200':
          $ref: '#/components/responses/CollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Native MQTT Bindings v1]
      summary: Create a Native MQTT Binding v1 draft
      operationId: createNativeMqttBindingV1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeMqttBindingAuthoringV1'
      responses:
        '201':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/native-mqtt-bindings/{binding}:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/BindingUuid'
    get:
      tags: [Native MQTT Bindings v1]
      summary: Get a Native MQTT Binding v1 aggregate
      operationId: getNativeMqttBindingV1
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Native MQTT Bindings v1]
      summary: Replace a Native MQTT Binding v1 draft at the expected revision
      operationId: replaceNativeMqttBindingV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeMqttBindingAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Native MQTT Bindings v1]
      summary: Delete an unreferenced Native MQTT Binding v1 draft
      operationId: deleteNativeMqttBindingV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Draft deleted.
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    get:
      tags: [Devices]
      summary: List logical Devices
      operationId: listDevicesV1
      parameters:
        - $ref: '#/components/parameters/DeviceStateFilter'
      responses:
        '200':
          $ref: '#/components/responses/DeviceCollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Devices]
      summary: Create a logical Device draft
      operationId: createDeviceV1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthoringV1'
      responses:
        '201':
          $ref: '#/components/responses/DeviceResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
    get:
      tags: [Devices]
      summary: Get a logical Device
      operationId: getDeviceV1
      responses:
        '200':
          $ref: '#/components/responses/DeviceResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Devices]
      summary: Replace a logical Device draft at the expected revision
      operationId: replaceDeviceV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/DeviceResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Devices]
      summary: Delete a logical Device draft
      operationId: deleteDeviceV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Device draft deleted.
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}/register:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Devices]
      summary: Register a Device against its identity-matched Runtime Bundle
      operationId: registerDeviceV1
      responses:
        '200':
          $ref: '#/components/responses/DeviceResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}/archive:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Devices]
      summary: Archive a registered Device
      operationId: archiveDeviceV1
      responses:
        '200':
          $ref: '#/components/responses/DeviceResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}/definition-assignment:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
    get:
      tags: [Devices]
      summary: Get a Device definition assignment
      operationId: getDeviceDefinitionAssignmentV1
      responses:
        '200':
          $ref: '#/components/responses/DeviceDefinitionAssignmentResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Devices]
      summary: Replace a Device definition assignment at the expected revision
      operationId: replaceDeviceDefinitionAssignmentV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceDefinitionAssignmentAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/DeviceDefinitionAssignmentResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}/definition-assignment/compile:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
    post:
      tags: [Definition compilation]
      summary: Replay fixtures against the exact saved routed Device assignment
      operationId: compileDeviceDefinitionAssignmentV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionFixtureRequestV1'
      responses:
        '200':
          $ref: '#/components/responses/DefinitionPreviewResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/devices/{device}/definition-assignment/pin:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/DeviceUuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    post:
      tags: [Definition compilation]
      summary: Recompile and pin an identity-matched Runtime Bundle
      operationId: pinDeviceRuntimeBundleV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefinitionFixtureRequestV1'
      responses:
        '200':
          $ref: '#/components/responses/RuntimeBundlePinResponse'
        '422':
          $ref: '#/components/responses/DefinitionCompileFailureResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/gateways:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    get:
      tags: [Gateways]
      summary: List Gateway identities
      operationId: listGatewaysV1
      responses:
        '200':
          $ref: '#/components/responses/CollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Gateways]
      summary: Create a Gateway identity without broker credentials
      operationId: createGatewayV1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayAuthoringV1'
      responses:
        '201':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/gateways/{gateway}:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/GatewayUuid'
    get:
      tags: [Gateways]
      summary: Get a Gateway identity
      operationId: getGatewayV1
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Gateways]
      summary: Replace Gateway metadata at the expected revision
      operationId: replaceGatewayV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Gateways]
      summary: Delete an unreferenced Gateway identity
      operationId: deleteGatewayV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Gateway deleted.
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/gateway-routes:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
    get:
      tags: [Gateway Routes]
      summary: List Gateway Routes
      operationId: listGatewayRoutesV1
      responses:
        '200':
          $ref: '#/components/responses/CollectionResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Gateway Routes]
      summary: Create a Gateway-to-logical-Device route
      operationId: createGatewayRouteV1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayRouteAuthoringV1'
      responses:
        '201':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /api/v1/gateway-routes/{route}:
    parameters:
      - $ref: '#/components/parameters/OrganizationContext'
      - $ref: '#/components/parameters/GatewayRouteUuid'
    get:
      tags: [Gateway Routes]
      summary: Get a Gateway Route
      operationId: getGatewayRouteV1
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Gateway Routes]
      summary: Replace a Gateway Route at the expected revision
      operationId: replaceGatewayRouteV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayRouteAuthoringV1'
      responses:
        '200':
          $ref: '#/components/responses/ResourceResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Gateway Routes]
      summary: Delete or disable an unreferenced Gateway Route
      operationId: deleteGatewayRouteV1
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Route deleted.
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: iot_os_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    OrganizationContext:
      name: X-Organization-UUID
      in: header
      required: true
      description: Active tenant UUID. Authorization derives tenant identity from the authenticated context.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IfMatchProfile:
      name: If-Match-Profile
      in: header
      required: true
      description: Strong Device Profile aggregate revision used by coordinated publication.
      schema:
        type: string
        minLength: 1
    IfMatchBinding:
      name: If-Match-Binding
      in: header
      required: true
      description: Strong Native MQTT Binding aggregate revision used by coordinated publication.
      schema:
        type: string
        minLength: 1
    ProfileUuid:
      name: profile
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BindingUuid:
      name: binding
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceUuid:
      name: device
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/DeviceLifecycleStateV1'
    GatewayUuid:
      name: gateway
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GatewayRouteUuid:
      name: route
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    DeviceProfileAuthoringV1:
      $ref: ../definitions/device-profile/v1/authoring.schema.json
    DeviceProfileArtifactV1:
      $ref: ../definitions/device-profile/v1/artifact.schema.json
    NativeMqttBindingAuthoringV1:
      $ref: ../definitions/native-mqtt-binding/v1/authoring.schema.json
    NativeMqttBindingArtifactV1:
      $ref: ../definitions/native-mqtt-binding/v1/artifact.schema.json
    GatewayAuthoringV1:
      $ref: ../definitions/gateway/v1/authoring.schema.json
    GatewayRouteAuthoringV1:
      $ref: ../definitions/gateway-route/v1/authoring.schema.json
    DeviceAuthoringV1:
      $ref: ../definitions/device/v1/authoring.schema.json
    DeviceDefinitionAssignmentAuthoringV1:
      $ref: ../definitions/device-definition-assignment/v1/authoring.schema.json
    DefinitionCompileRequestV1:
      $ref: ../definitions/definition-compile-request/v1/schema.json
    DefinitionFixtureRequestV1:
      $ref: ../definitions/definition-fixtures/v1/schema.json
    DefinitionPreviewV1:
      $ref: ../definitions/definition-preview/v1/schema.json
    RuntimeBundleV1:
      $ref: ../definitions/runtime-bundle/v1/schema.json
    CanonicalTelemetryV1:
      $ref: ../definitions/canonical-telemetry/v1/schema.json
    DeviceLifecycleStateV1:
      type: string
      enum: [draft, registered, archived]
    ArtifactHashOrNullV1:
      type: [string, 'null']
      pattern: '^[a-f0-9]{64}$'
    DeviceDefinitionAssignmentResourceV1:
      type: object
      additionalProperties: false
      required:
        - uuid
        - device_uuid
        - profile_version_uuid
        - binding_version_uuid
        - gateway_route_uuid
        - profile_artifact_hash
        - binding_artifact_hash
        - route_source_hash
        - runtime_bundle_hash
        - runtime_bundle
        - runtime_compiled_at
        - revision
        - etag
        - locked_at
        - created_at
        - updated_at
      properties:
        uuid:
          type: string
          format: uuid
        device_uuid:
          type: string
          format: uuid
        profile_version_uuid:
          type: string
          format: uuid
        binding_version_uuid:
          type: string
          format: uuid
        gateway_route_uuid:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        profile_artifact_hash:
          $ref: '#/components/schemas/ArtifactHashOrNullV1'
        binding_artifact_hash:
          $ref: '#/components/schemas/ArtifactHashOrNullV1'
        route_source_hash:
          $ref: '#/components/schemas/ArtifactHashOrNullV1'
        runtime_bundle_hash:
          $ref: '#/components/schemas/ArtifactHashOrNullV1'
        runtime_bundle:
          oneOf:
            - $ref: '#/components/schemas/RuntimeBundleV1'
            - type: 'null'
        runtime_compiled_at:
          type: [string, 'null']
          format: date-time
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
          minLength: 1
        locked_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
    DeviceResourceV1:
      type: object
      additionalProperties: false
      required:
        - uuid
        - external_id
        - name
        - description
        - lifecycle_state
        - revision
        - etag
        - registered_at
        - archived_at
        - created_at
        - updated_at
        - definition_assignment
      properties:
        uuid:
          type: string
          format: uuid
        external_id:
          type: string
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: [string, 'null']
          maxLength: 4000
        lifecycle_state:
          $ref: '#/components/schemas/DeviceLifecycleStateV1'
        revision:
          type: integer
          minimum: 1
        etag:
          type: string
          minLength: 1
        registered_at:
          type: [string, 'null']
          format: date-time
        archived_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
        definition_assignment:
          oneOf:
            - $ref: '#/components/schemas/DeviceDefinitionAssignmentResourceV1'
            - type: 'null'
    DeviceResourceEnvelopeV1:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeviceResourceV1'
    DeviceCollectionEnvelopeV1:
      type: object
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceResourceV1'
    DeviceDefinitionAssignmentEnvelopeV1:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DeviceDefinitionAssignmentResourceV1'
    DefinitionPreviewEnvelopeV1:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DefinitionPreviewV1'
    DefinitionPublicationEnvelopeV1:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [profile, binding, compile]
          properties:
            profile: true
            binding: true
            compile:
              $ref: '#/components/schemas/DefinitionPreviewV1'
    RuntimeBundlePinEnvelopeV1:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [assignment, compile]
          properties:
            assignment:
              $ref: '#/components/schemas/DeviceDefinitionAssignmentResourceV1'
            compile:
              $ref: '#/components/schemas/DefinitionPreviewV1'
    DefinitionCompileFailureEnvelopeV1:
      type: object
      additionalProperties: false
      required: [message, data]
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/DefinitionPreviewV1'
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
