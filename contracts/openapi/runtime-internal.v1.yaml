openapi: 3.1.0
info:
  title: IoT OS Runtime Internal API v1
  version: 1.0.0
  description: >-
    Authenticated service-to-service compiler API for route-aware v1
    definitions. It is not a tenant or browser API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8081
    description: Local Go runtime
security:
  - internalBearerAuth: []
tags:
  - name: Definition Compiler v1
    description: Deterministic Profile v1, Binding v1, and Gateway Route compilation.
paths:
  /internal/v1/definitions/compile:
    post:
      tags: [Definition Compiler v1]
      summary: Compile and replay a route-aware Device definition
      operationId: compileDeviceDefinitionV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../definitions/definition-compile-request/v1/schema.json
      responses:
        '200':
          description: Deterministic compile result, including domain diagnostics.
          headers:
            Cache-Control:
              description: Compile responses are never cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../definitions/definition-preview/v1/schema.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/CompilerUnavailable'
components:
  securitySchemes:
    internalBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-static-token
      description: Opaque service-to-service token at least 32 bytes long.
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Malformed JSON, unknown request fields, or multiple JSON values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid internal bearer token.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTooLarge:
      description: Request exceeds the 2 MiB runtime limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CompilerUnavailable:
      description: Runtime could not complete compilation because of an internal failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
