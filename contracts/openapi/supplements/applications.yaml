# Application management operations.
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
operations:
  POST /v1/organizations/{organization}/applications:
    responses:
      '422':
        $ref: '#/components/responses/Unprocessable'
  POST /v1/organizations/{organization}/applications/{application}/token:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/applications/{application}/webhook:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/applications/{application}/webhook/deliveries/{delivery}/retry:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
