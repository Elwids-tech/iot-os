# Automation operations (workflows, scenarios, alerts).
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
operations:
  POST /v1/organizations/{organization}/alerts/{alert}/comments:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/alerts/{alert}/deliveries/{delivery}/retry:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/workflows:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  GET /v1/organizations/{organization}/workflows/dag/node-types:
    responses:
      '503':
        $ref: '#/components/responses/RuntimeUnavailable'
  POST /v1/organizations/{organization}/workflows/{workflow}/deployments:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/workflows/{workflow}/layout:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/workflows/{workflow}/notifications:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/workflows/{workflow}/scenarios:
    responses:
      '201':
        description: The scenario was created.
        content:
          application/json:
            schema: {}
  PUT /v1/organizations/{organization}/workflows/{workflow}/scenarios/{scenario}:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/workflows/{workflow}/archive:
    description: >-
      Turns the automation off, by requesting a disable deployment when it runs, and
      hides it from lists. Its draft, layout and activation then get 409 until it is
      restored. Needs `Workflow.manage` and `Workflow.activate`; 409 while an
      activation is pending, 422 for a geofence workflow. Archiving an archived
      automation changes nothing.
    responses:
      '200':
        description: The automation is archived; a disable deployment may still be pending.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: '2026-11-11T09:30:00+00:00'
                archived_by:
                  user_id: 42
                  name: Ana Silva
      '409':
        $ref: '#/components/responses/Conflict'
      '422':
        $ref: '#/components/responses/Unprocessable'
  POST /v1/organizations/{organization}/workflows/{workflow}/restore:
    description: >-
      Brings an archived automation back to lists. It stays off until someone activates
      it. Needs `Workflow.manage`. Restoring a current automation changes nothing.
    responses:
      '200':
        description: The automation is current again, and off.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: null
                archived_by: null
