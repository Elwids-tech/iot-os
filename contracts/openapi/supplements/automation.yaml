# Automation operations (workflows, scenarios, alerts).
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
components:
  schemas:
    AlertDelivery:
      type: object
      additionalProperties: false
      required: [uuid, recipient_id, recipient_name, type, channel, status, attempts, diagnostic, sent_at, retry_generation, devices_total, devices_reached, history]
      properties:
        uuid: {type: string, format: uuid}
        recipient_id: {type: integer}
        recipient_name: {type: string}
        type:
          type: string
          enum: [activated, cleared]
        channel:
          type: string
          enum: [email, push]
        status:
          type: string
          description: '`pending`, `sent`, `failed` or `cancelled`; a push may also be `summarised`, carried by a burst summary.'
        attempts: {type: integer}
        diagnostic:
          type: [string, 'null']
          description: Why it was cancelled or failed.
        sent_at: {type: [string, 'null']}
        retry_generation:
          type: integer
          description: Sent back with a retry, so a retry of a changed delivery is refused.
        devices_total:
          type: [integer, 'null']
          description: Push only, the person's devices tried in the latest attempt; null for email.
        devices_reached:
          type: [integer, 'null']
          description: Push only, the devices whose push service accepted it; null for email.
        history:
          type: array
          description: One row per attempt; for push, one row per device.
          items:
            $ref: '#/components/schemas/AlertDeliveryAttempt'
    AlertDeliveryAttempt:
      type: object
      additionalProperties: false
      required: [attempt, status, created_at, device_label, response_status]
      properties:
        attempt: {type: integer}
        status: {type: string}
        created_at: {type: string}
        device_label:
          type: [string, 'null']
          description: Push only, the device's label as it was then.
        response_status:
          type: [integer, 'null']
          description: Push only, the push service's HTTP status; null when it never answered.
operations:
  POST /v1/organizations/{organization}/alerts/{alert}/comments:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  GET /v1/organizations/{organization}/alerts/{alert}/deliveries:
    description: |-
      Each email and push delivery of the alert. Push rows (spec 033) carry how many of
      the person's devices were tried and reached, a `summarised` status when a burst
      summary carried them, and one history row per device with its label and the push
      service's status.
    responses:
      '200':
        description: The alert's deliveries, oldest first.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/AlertDelivery'
  POST /v1/organizations/{organization}/alerts/{alert}/deliveries/{delivery}/retry:
    description: |-
      Retries a failed delivery on its own channel, email or push. A summarised push is
      never retried.
    responses:
      '202':
        description: The delivery is queued again.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  additionalProperties: false
                  required: [status]
                  properties:
                    status:
                      type: string
                      enum: [pending]
      '409':
        $ref: '#/components/responses/Conflict'
  GET /v1/organizations/{organization}/workflows/{workflow}/series:
    description: |-
      The automation's evaluations over the last hours (1 to 168, default 6) as compact
      points, oldest first: what each step decided, without the full trace. `nodes`
      describes the deployed steps the points refer to. At most 1,000 points.
    responses:
      '200':
        description: The points of the period and the deployed steps.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to, data, nodes]
              properties:
                from: {type: string, format: date-time}
                to: {type: string, format: date-time}
                data:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, operation_uuid, at, trigger, outcome, intents, generation, nodes]
                    properties:
                      id: {type: string}
                      operation_uuid: {type: string, format: uuid}
                      at: {type: string, format: date-time}
                      trigger:
                        type: string
                        description: '`telemetry` or `timer`.'
                      outcome:
                        type: string
                        description: '`evaluated`, `triggered`, `waiting` or `suspended`.'
                      intents:
                        type: integer
                        description: How many actions this evaluation requested.
                      generation:
                        type: integer
                        description: The deployment generation that ran it.
                      nodes:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [node_id, status, known]
                          properties:
                            node_id: {type: string}
                            status: {type: string}
                            known:
                              type: boolean
                              description: Whether the step's `out` port had a usable value.
                            value:
                              type: [boolean, number, string, 'null']
                              description: The `out` value, when known.
                            reason: {type: string}
                            observed_at: {type: [string, 'null']}
                            side:
                              type: [string, 'null']
                              description: For a branch, the side it took (`true` or `false`).
                nodes:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, type]
                    properties:
                      id: {type: string}
                      type: {type: string}
                      seconds:
                        type: integer
                        description: For a sustained condition, how long it must hold.
                      title:
                        type: string
                        description: For an alert, its title.
                      binding:
                        type: object
                        additionalProperties: false
                        required: [role, device_uuid, parameter_label, unit, data_type]
                        properties:
                          role: {type: string}
                          device_uuid: {type: string, format: uuid}
                          device_name: {type: [string, 'null']}
                          parameter_label: {type: string}
                          unit: {type: string}
                          data_type: {type: string}
                          fresh_seconds: {type: [integer, 'null']}
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/organizations/{organization}/workflows:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  GET /v1/organizations/{organization}/workflows/dag/node-types:
    responses:
      '503':
        $ref: '#/components/responses/RuntimeUnavailable'
  POST /v1/organizations/{organization}/workflows/{workflow}/deployments:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/workflows/{workflow}/layout:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/workflows/{workflow}/notifications:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/workflows/{workflow}/scenarios:
    responses:
      '201':
        description: The scenario was created.
        content:
          application/json:
            schema: {}
  PUT /v1/organizations/{organization}/workflows/{workflow}/scenarios/{scenario}:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/workflows/{workflow}/archive:
    description: >-
      Turns the automation off, by requesting a disable deployment when it runs, and
      hides it from lists. Its draft, layout and activation then get 409 until it is
      restored. Needs `Workflow.manage` and `Workflow.activate`; 409 while an
      activation is pending, 422 for a geofence workflow. Archiving an archived
      automation changes nothing.
    responses:
      '200':
        description: The automation is archived; a disable deployment may still be pending.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: '2026-11-11T09:30:00+00:00'
                archived_by:
                  user_id: 42
                  name: Ana Silva
      '409':
        $ref: '#/components/responses/Conflict'
      '422':
        $ref: '#/components/responses/Unprocessable'
  POST /v1/organizations/{organization}/workflows/{workflow}/restore:
    description: >-
      Brings an archived automation back to lists. It stays off until someone activates
      it. Needs `Workflow.manage`. Restoring a current automation changes nothing.
    responses:
      '200':
        description: The automation is current again, and off.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: null
                archived_by: null
