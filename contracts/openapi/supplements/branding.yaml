# Brands and logos (spec 036, specs/036-white-label-custom-domains/contracts/branding-api.md).
# Statuses and bodies inference missed. Format: ../meta/supplement.schema.json.
components:
  schemas:
    BrandImageRefused:
      type: object
      description: >-
        422 for an image that was not accepted. `code` names the rule it broke:
        `image_type` (not a PNG, JPEG or WebP image by content), `image_too_large` (over
        1 MB, or over the largest dimensions), `image_not_square` (an icon more than 2%
        off square) or `image_too_small` (an icon under 512 × 512). Without `code`, the
        `image` field was missing or failed to upload.
      required: [message, errors]
      properties:
        message: {type: string}
        code: {type: string, enum: [image_type, image_too_large, image_not_square, image_too_small]}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
  responses:
    BrandImage:
      description: The image as PNG, cached for a year. Its address changes when the image does.
      content:
        image/png:
          schema:
            type: string
            format: binary
    BrandImageRefused:
      description: The image was not accepted; `code` says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BrandImageRefused'
    BrandChanged:
      description: The brand was changed since `revision` was read (`brand_changed`). Read it again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
    BrandingNotAllowed:
      description: >-
        Branding is not part of the billing account's plan (`branding_not_allowed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
    AddressRefused:
      description: >-
        The address cannot be claimed or changed. `code` is `addresses_unavailable`
        (this deployment does not serve portal addresses), `name_taken` (another account
        holds the name, or released it less than 30 days ago), `name_reserved`, or
        `suspended` (platform staff stopped the account's address).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
    CustomDomainNotAllowed:
      description: >-
        A custom domain is not part of the billing account's plan
        (`custom_domain_not_allowed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
    DomainRefused:
      description: >-
        The domain cannot be claimed. `code` is `addresses_unavailable` (this deployment
        does not serve portal addresses), `host_taken` (another account uses or has asked
        for it), `host_held` (another account's portal was served there less than 30 days
        ago) or `domain_exists` (the account already has a domain; remove it first).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
    DomainInvalid:
      description: >-
        The host is missing or is not a domain name (`host_invalid`), is a bare domain
        such as `example.org` (`bare_domain`: use a subdomain, which can carry a CNAME
        record), or is under the platform's own domain (`platform_domain`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    AddressNameInvalid:
      description: >-
        The name is missing, or is not 3 to 40 letters, numbers and single hyphens that
        start and end with a letter or number (`name_invalid`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
operations:
  GET /v1/brand-assets/{asset}/{variant}:
    description: |-
      A brand image, public because the sign-in page shows it before anyone signs in.
      `asset` is the image's uuid followed by the first 12 characters of its content
      hash; `variant` is `logo`, or for an icon `512`, `192`, `180`, `64` or `maskable`.
    responses:
      '200':
        $ref: '#/components/responses/BrandImage'
      '404':
        $ref: '#/components/responses/NotFound'
  GET /v1/billing-accounts/{billingAccount}/branding:
    description: |-
      What the branding page reads for a billing account the signed-in person owns: its
      brand, its portal addresses, what its plan allows and the image limits. Reading
      works without the `branding` allowance, so the page can say so.
  PUT /v1/billing-accounts/{billingAccount}/brand:
    description: |-
      Saves the brand's product name, short name and support link together. Needs the
      account's `branding` allowance. The brand takes effect once it has a product name.
    responses:
      '403':
        $ref: '#/components/responses/BrandingNotAllowed'
      '409':
        $ref: '#/components/responses/BrandChanged'
  POST /v1/billing-accounts/{billingAccount}/brand/images/{role}:
    description: |-
      Sets the brand's `logo`, `logo_dark` or `icon` from a multipart `image`: PNG, JPEG
      or WebP by content, at most 1 MB. The image is re-encoded; a logo is scaled to fit
      480 × 160 and an icon, square and at least 512 × 512, is stored in every size the
      installed app needs. It is a POST because a multipart body is only read on POST.
    responses:
      '403':
        $ref: '#/components/responses/BrandingNotAllowed'
      '422':
        $ref: '#/components/responses/BrandImageRefused'
  DELETE /v1/billing-accounts/{billingAccount}/brand/images/{role}:
    responses:
      '403':
        $ref: '#/components/responses/BrandingNotAllowed'
  GET /v1/admin/billing-accounts/{billingAccount}/branding:
    description: Any billing account's branding, for platform staff.
  PUT /v1/admin/billing-accounts/{billingAccount}/brand:
    description: |-
      Saves a billing account's brand on its owners' behalf. The allowance is not
      checked: the brand takes effect only once `branding` is on for the account.
    responses:
      '409':
        $ref: '#/components/responses/BrandChanged'
  POST /v1/admin/billing-accounts/{billingAccount}/brand/images/{role}:
    responses:
      '422':
        $ref: '#/components/responses/BrandImageRefused'
  POST /v1/organizations/{organization}/logo:
    description: |-
      Sets the organization's own logo from a multipart `image`, under the same rules as
      a brand's logo. Needs `Organization.update` and no allowance.
    requestBody: &logoBody
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [image]
            properties:
              image:
                type: string
                format: binary
                contentMediaType: application/octet-stream
    responses:
      '422':
        $ref: '#/components/responses/BrandImageRefused'
  POST /v1/organizations/{organization}/logo/dark:
    description: Sets the logo shown on dark appearance. Without it, the logo is shown on both.
    requestBody: *logoBody
    responses:
      '422':
        $ref: '#/components/responses/BrandImageRefused'
  PUT /v1/billing-accounts/{billingAccount}/addresses/name:
    description: |-
      Claims a name under the platform's domain for the billing account, or renames the
      one it holds: `acme` becomes `acme.<domain>`. The name serves the branded portal
      at once. A renamed name is released and redirects to the new one for 30 days.
      Needs the account's `branding` allowance.
    responses:
      '403':
        $ref: '#/components/responses/BrandingNotAllowed'
      '409':
        $ref: '#/components/responses/AddressRefused'
      '422':
        $ref: '#/components/responses/AddressNameInvalid'
  PUT /v1/billing-accounts/{billingAccount}/addresses/domain:
    description: |-
      Asks for a custom domain for the billing account, such as `portal.example.org`.
      The answer carries the CNAME `record` to add at the domain's DNS provider. The
      address waits (`waiting_dns`) until a check finds the record, then serves the
      branded portal and becomes the account's main address. A request whose record is
      not found within 7 days lapses (`lapses_at`). Needs the account's `branding` and
      `custom_domain` allowances. Asking again for the same domain returns the same
      record.
    responses:
      '403':
        $ref: '#/components/responses/CustomDomainNotAllowed'
      '409':
        $ref: '#/components/responses/DomainRefused'
      '422':
        $ref: '#/components/responses/DomainInvalid'
  POST /v1/billing-accounts/{billingAccount}/addresses/{address}/check:
    description: |-
      Looks the custom domain's DNS record up now instead of waiting for the scheduled
      check, at most once a minute for each address, and returns the address as it then
      stands. A name under the platform's domain is returned unchanged.
    responses:
      '429':
        description: The address was checked less than a minute ago (`checked_recently`). `Retry-After` says when to try again.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodedError'
  DELETE /v1/billing-accounts/{billingAccount}/addresses/{address}:
    description: |-
      Releases an address. It stops serving within a minute, people signed in there lose
      the portal, and no other account can claim the host for 30 days.
    responses:
      '409':
        $ref: '#/components/responses/AddressRefused'
  PUT /v1/admin/billing-accounts/{billingAccount}/addresses/name:
    description: Claims or renames a billing account's name on its owners' behalf, without the allowance check.
    responses:
      '409':
        $ref: '#/components/responses/AddressRefused'
      '422':
        $ref: '#/components/responses/AddressNameInvalid'
  PUT /v1/admin/billing-accounts/{billingAccount}/addresses/domain:
    description: Asks for a custom domain on a billing account's owners' behalf, without the allowance check.
    responses:
      '409':
        $ref: '#/components/responses/DomainRefused'
      '422':
        $ref: '#/components/responses/DomainInvalid'
  POST /v1/admin/billing-accounts/{billingAccount}/addresses/{address}/check:
    description: Looks a billing account's custom domain record up now, at most once a minute for each address.
    responses:
      '429':
        description: The address was checked less than a minute ago (`checked_recently`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodedError'
  GET /v1/portal/runtime-config.js:
    description: |-
      What the portal reads before it starts on a host that is not the platform's own
      (specs/036-white-label-custom-domains/contracts/portal-bootstrap.md): one
      JavaScript statement that sets `window.__IOT_CONFIG__`, with the host's brand and
      address. A host that is not in use gets `address.state` `not_in_use` and no brand.
      Public and never cached.
    responses:
      '200':
        description: The statement.
        content:
          application/javascript:
            schema:
              type: string
  GET /v1/portal/manifest.webmanifest:
    description: |-
      The web app manifest for a host that is not the platform's own: the one the portal
      builds, with `name` and `short_name` from the host's brand, so the installed app
      carries the brand. The portal's proxy sends `/manifest.webmanifest` here. Public.
    responses:
      '200':
        description: The manifest.
        content:
          application/manifest+json:
            schema:
              type: object
              required: [name, short_name, description, id, start_url, scope, display, background_color, theme_color, lang, icons]
              properties:
                name: { type: string }
                short_name: { type: string }
                description: { type: string }
                id: { type: string }
                start_url: { type: string }
                scope: { type: string }
                display: { type: string }
                background_color: { type: string }
                theme_color: { type: string }
                lang: { type: string }
                icons:
                  type: array
                  items:
                    type: object
                    required: [src, sizes, type]
                    properties:
                      src: { type: string }
                      sizes: { type: string }
                      type: { type: string }
                      purpose: { type: string }
      '404':
        $ref: '#/components/responses/NotFound'
  GET /v1/portal/icons/{name}:
    description: |-
      One of the five fixed icon files the manifest, the page and notifications name
      (`pwa-64x64.png`, `pwa-192x192.png`, `pwa-512x512.png`,
      `maskable-icon-512x512.png`, `apple-touch-icon-180x180.png`), answered with the
      brand's icon in that size. Public.
    responses:
      '200':
        $ref: '#/components/responses/BrandImage'
      '204':
        description: >-
          The brand has no icon. `X-Accel-Redirect` tells the portal's proxy to send the
          platform's own file, so a browser never sees this answer.
      '404':
        $ref: '#/components/responses/NotFound'
  POST /v1/invitations/{token}/accept:
    responses:
      '403':
        description: >-
          The request came from a billing account's portal address and the invitation is
          to an organization of another account, or to a platform role
          (`not_available_here`). The invitation stays pending.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodedError'
