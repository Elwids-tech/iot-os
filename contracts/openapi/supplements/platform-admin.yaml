# Platform administration operations.
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
components:
  schemas:
    OrganizationNotEmpty:
      type: object
      description: 409 when the organization still holds data that blocks deletion (spec 006).
      required: [message, blockers]
      properties:
        message:
          type: string
        blockers:
          type: array
          description: Each kind of blocking data that has rows, with its count.
          items:
            $ref: '#/components/schemas/OrganizationDeletionEntryResource'
operations:
  PUT /v1/admin/settings/telemetry-retention:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/admin/assistant-settings:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  DELETE /v1/admin/assistant-settings/keys/{provider}:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  PUT /v1/admin/super-administrators/{user}:
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
  DELETE /v1/admin/super-administrators/{user}:
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/admin/users/{user}/two-step/reset:
    summary: Reset a person's two-step sign-in
    description: >-
      Removes the person's authenticator, recovery codes and passkeys, ends every session
      and kept sign-in of theirs, emails them and records `person.two_step_reset` with the
      reason (spec 034, FR-024). `403` when the administrator is resetting themselves, or
      the person is a super administrator and the administrator is not.
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
  POST /v1/admin/users/{user}/impersonation:
    summary: Impersonate a person
    description: >-
      A super administrator becomes the person in this browser's session, which the admin
      app and the portal share, and records `user.impersonation_started`. `return_url` is
      the admin page to come back to on leaving; an address outside the platform's own
      apps is ignored. The person's two-step sign-in is not asked for. While impersonating,
      `GET /v1/me` carries `impersonation`; the person's two-step, passkeys, password
      confirmation and agent consent answer `403` `impersonating`; and audit events
      recorded as the person carry `impersonated_by`. `403` unless a super administrator
      asks; `422` for themselves, another super administrator, or while already
      impersonating.
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/admin/super-administrators/invitations:
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
  DELETE /v1/admin/organizations/{organization}:
    responses:
      '409':
        description: The organization still holds devices or other data that blocks deletion; nothing was deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationNotEmpty'
