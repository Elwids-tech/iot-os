# Billing accounts (spec 023, ADR-026), plans and allowances (specs 028 and 029, ADR-035),
# prices, tax and invoices (spec 029 US6).
#
# Statuses the code returns that inference misses. Request and response bodies are
# inferred from the form requests and resources.
# Format: ../meta/supplement.schema.json.
components:
  schemas:
    PlanChangeNeedsConfirmation:
      type: object
      required: [message, affected_accounts]
      properties:
        message:
          type: string
        affected_accounts:
          type: integer
          description: The billing accounts on the plan now. Send it back as `confirm_affected` to apply the change to all of them.
    RetentionNeedsConfirmation:
      type: object
      required: [message, retention]
      properties:
        message:
          type: string
        retention:
          type: object
          required: [deletion_from, organizations]
          properties:
            deletion_from:
              type: string
              format: date-time
              description: When history older than the new period starts to be deleted, after the grace period.
            organizations:
              type: array
              description: Each organization whose effective retention the change shortens.
              items:
                type: object
                required: [uuid, name, from_days, to_days]
                properties:
                  uuid:
                    type: string
                    format: uuid
                  name:
                    type: string
                  from_days:
                    type: integer
                  to_days:
                    type: integer
    WaitingInvoice:
      type: object
      required: [billing_account, month, waiting_since, overdue]
      properties:
        billing_account:
          type: object
          required: [uuid, name]
          properties:
            uuid:
              type: string
              format: uuid
            name:
              type: string
        month:
          type: string
          description: The first day of the UTC month, `YYYY-MM-DD`.
        waiting_since:
          type: string
          format: date-time
          description: The month's end; the invoice waits for the runtime to report usage up to it.
        overdue:
          type: boolean
          description: Waiting longer than `BILLING_INVOICE_WAIT_DAYS`, so an administrator may draft it anyway (spec 029 FR-033).
operations:
  GET /v1/admin/billing/invoices/waiting:
    responses:
      '200':
        description: Accounts whose invoice for an ended month waits for final usage, for every such month or the one asked for; empty once usage is final.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/WaitingInvoice'
  DELETE /v1/admin/billing-accounts/{billingAccount}:
    responses:
      '409':
        description: The billing account still has organizations, which must be moved first, or it has issued invoices, which are kept for good (spec 029 FR-037). Nothing was deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  PATCH /v1/admin/billing-plans/{billingPlan}:
    responses:
      '409':
        description: The change alters the allowances of a plan billing accounts are on, and `confirm_affected` does not match their number; or, once that matches, it shortens organizations' telemetry retention and needs `confirm_retention` (spec 029 US4). Nothing was changed.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PlanChangeNeedsConfirmation'
                - $ref: '#/components/schemas/RetentionNeedsConfirmation'
  DELETE /v1/admin/billing-plans/{billingPlan}:
    responses:
      '409':
        description: The plan has been assigned to a billing account at some point, so it cannot be deleted; archive it instead. Nothing was deleted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  PUT /v1/admin/billing-accounts/{billingAccount}/plan:
    responses:
      '409':
        description: The change shortens organizations' telemetry retention (spec 029 US4). Send `confirm_retention` true to apply it; history older than the new period is deleted only after the grace period. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionNeedsConfirmation'
  POST /v1/admin/billing-accounts/{billingAccount}/trial:
    responses:
      '409':
        description: The account is already on a trial; change or end it instead. Or the trial's plan shortens organizations' telemetry retention (spec 029 US4); send `confirm_retention` true to apply it. Nothing was changed.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/RetentionNeedsConfirmation'
  PATCH /v1/admin/billing-accounts/{billingAccount}/trial:
    responses:
      '409':
        description: The account is not on a trial. Or the new plan shortens organizations' telemetry retention (spec 029 US4); send `confirm_retention` true to apply it. Nothing was changed.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/RetentionNeedsConfirmation'
  POST /v1/admin/billing-accounts/{billingAccount}/trial/end:
    responses:
      '409':
        description: The account is not on a trial. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing-accounts/{billingAccount}/trial/convert:
    responses:
      '409':
        description: The account is not on a trial, nor on one that ended without a payment method. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  PUT /v1/admin/billing-accounts/{billingAccount}/allowances/{kind}:
    responses:
      '409':
        description: The change shortens organizations' telemetry retention (spec 029 US4). Send `confirm_retention` true to apply it; history older than the new period is deleted only after the grace period. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionNeedsConfirmation'
  DELETE /v1/admin/billing-accounts/{billingAccount}/allowances/{kind}:
    responses:
      '409':
        description: The change shortens organizations' telemetry retention (spec 029 US4). Send `confirm_retention` true to apply it; history older than the new period is deleted only after the grace period. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionNeedsConfirmation'
  PUT /v1/admin/organizations/{organization}/billing-account:
    responses:
      '409':
        description: The change shortens organizations' telemetry retention (spec 029 US4). Send `confirm_retention` true to apply it; history older than the new period is deleted only after the grace period. Nothing was changed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionNeedsConfirmation'
  PUT /v1/admin/billing/settings:
    responses:
      '409':
        description: Someone changed the settings since `revision` was read. Nothing was changed; read them again.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing-accounts/{billingAccount}/invoices:
    responses:
      '409':
        description: The account already has an invoice for that month. Nothing was drafted.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing/invoices/{invoice}/recalculate:
    responses:
      '409':
        description: The invoice is issued and cannot change; correct it with a credit note.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing/invoices/{invoice}/adjustments:
    responses:
      '409':
        description: The invoice is issued and cannot change; correct it with a credit note.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  DELETE /v1/admin/billing/invoices/{invoice}/adjustments/{line}:
    responses:
      '409':
        description: The invoice is issued and cannot change; correct it with a credit note.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/billing-accounts/{billingAccount}/invoices/{invoice}/checkout:
    responses:
      '409':
        description: Nothing is owed on the invoice, or a payment for it is still being processed.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing/invoices/{invoice}/payments:
    responses:
      '409':
        description: The invoice is a draft; only an issued invoice takes payments.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
  POST /v1/admin/billing/invoices/{invoice}/issue:
    responses:
      '409':
        description: The invoice is already issued; its month has not ended, so its draft is still a preview; or it was drafted before the month's usage was final, which it is now, so it must be recalculated first (spec 029 FR-031).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/admin/billing/invoices/{invoice}/credit-notes:
    responses:
      '409':
        description: The invoice is a draft; adjust it instead of crediting it.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorMessage'
