# Account and public operations.
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
components:
  schemas:
    PushLevels:
      type: object
      description: Which alert levels a person receives by push; `recovery` is Cleared.
      additionalProperties: false
      required: [critical, warning, info, recovery]
      properties:
        critical: {type: boolean}
        warning: {type: boolean}
        info: {type: boolean}
        recovery: {type: boolean}
    PushDevice:
      type: object
      description: A browser where the person turned on push. Never its endpoint or keys.
      additionalProperties: false
      required: [uuid, label, created_at, last_reached_at, last_failed_at]
      properties:
        uuid: {type: string, format: uuid}
        label: {type: string, maxLength: 60}
        created_at: {type: string, format: date-time}
        last_reached_at: {type: [string, 'null'], format: date-time}
        last_failed_at: {type: [string, 'null'], format: date-time}
    PushSettings:
      type: object
      additionalProperties: false
      required: [available, public_key, enabled, levels, revision, organizations, devices]
      properties:
        available:
          type: boolean
          description: False when the deployment has no push key; hide every push control.
        public_key:
          type: [string, 'null']
          description: The VAPID public key browsers subscribe with; null when unavailable.
        enabled: {type: boolean}
        levels:
          description: Null until push was first turned on.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/PushLevels'
        revision: {type: integer, minimum: 0}
        organizations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [uuid, name, enabled]
            properties:
              uuid: {type: string, format: uuid}
              name: {type: string}
              enabled: {type: boolean}
        devices:
          type: array
          items:
            $ref: '#/components/schemas/PushDevice'
    PushDeviceRegistered:
      type: object
      additionalProperties: false
      required: [uuid, label, replaced]
      properties:
        uuid: {type: string, format: uuid}
        label: {type: string}
        replaced:
          description: The device removed to stay at ten, or null.
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [label]
              properties:
                label: {type: string}
    AuthenticatedUser:
      type: object
      description: The signed-in person, as `GET /v1/me` returns them.
      required: [id, name, email, email_verified_at, is_super_admin, capabilities, organizations]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string}
        email_verified_at: {type: [string, 'null'], format: date-time}
        is_super_admin: {type: boolean}
        capabilities:
          type: object
          description: What the person may open across the platform.
          additionalProperties: {type: boolean}
        organizations:
          type: array
          items:
            type: object
            required: [uuid, name, slug]
            properties:
              uuid: {type: string, format: uuid}
              name: {type: string}
              slug: {type: string}
              capabilities:
                type: object
                description: What the person may do in this organization.
                additionalProperties: {}
    TwoStepRequired:
      type: object
      description: >-
        The password was right and a second step is due (spec 034). No session exists
        yet; finish with `POST /v1/auth/two-step` within `expires_in` seconds.
      additionalProperties: false
      required: [two_step_required, expires_in, methods]
      properties:
        two_step_required: {const: true}
        expires_in: {type: integer, minimum: 1}
        methods:
          type: array
          description: How the person may finish.
          items:
            type: string
            enum: [code, recovery_code, passkey]
    TwoStepSignedIn:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuthenticatedUser'
        recovery_codes_remaining:
          type: integer
          minimum: 0
          description: Present when a recovery code was used; how many remain.
    TwoStepRefused:
      type: object
      description: >-
        A wrong code (`errors.code` or `errors.recovery_code`, with `attempts_left`), or
        no pending sign-in to finish (`errors.pending`: start again with the password).
      required: [message, errors]
      properties:
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        attempts_left: {type: integer, minimum: 1}
    SecuritySettings:
      type: object
      description: >-
        The person's sign-in security (spec 034). Never holds a secret or a recovery
        code.
      additionalProperties: false
      required: [two_step]
      properties:
        two_step:
          type: object
          additionalProperties: false
          required: [enabled, confirmed_at, recovery_codes_remaining, required, required_by, satisfied]
          properties:
            enabled: {type: boolean}
            confirmed_at: {type: [string, 'null'], format: date-time}
            recovery_codes_remaining: {type: integer, minimum: 0}
            required:
              type: boolean
              description: Whether the person must use two-step sign-in.
            required_by:
              type: array
              description: Why two-step is required for the person.
              items:
                oneOf:
                  - const: platform
                  - type: object
                    additionalProperties: false
                    required: [organization, name]
                    properties:
                      organization: {type: string, format: uuid}
                      name: {type: string}
            satisfied:
              type: boolean
              description: Whether the person has a second step set up.
    TwoStepSetup:
      type: object
      description: >-
        A new setup secret, shown to add the account to an authenticator app. Two-step
        is not on until `POST /v1/me/two-step/confirm` accepts a code from it.
      additionalProperties: false
      required: [qr_svg, setup_key, otpauth_url]
      properties:
        qr_svg:
          type: string
          description: The QR code as SVG markup. Show it as an image, never as HTML.
        setup_key:
          type: string
          description: The secret in groups of four, to type into the app.
        otpauth_url: {type: string}
    RecoveryCodes:
      type: object
      description: Eight one-time recovery codes. Shown only in this response.
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 8
          maxItems: 8
          items: {type: string}
    CodedError:
      type: object
      description: An error with a stable code for clients.
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
  responses:
    PasswordConfirmationRequired:
      description: >-
        The password was not confirmed in the last 15 minutes. Confirm it with
        `POST /v1/auth/confirm-password` and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    TwoStepConflict:
      description: >-
        Two-step sign-in is already on (`two_step_already_on`), is off where it must
        be on (`two_step_off`), or is required for the person and cannot be turned off
        (`two_step_required`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodedError'
operations:
  POST /v1/auth/login:
    description: |-
      Signs in on the first-party session. With `remember: true` (Keep me signed in,
      spec 033) it also starts a kept sign-in for this browser and sets the `iot_kept`
      cookie: HttpOnly, on the session's domain, Secure and SameSite as the session
      cookie, for a fixed 30 days that use never extends. While the kept sign-in is live,
      a request from the portal or admin app that has lost its session signs the same
      person back in without a password. Signing out on that browser or resetting the
      password ends it. A missing or `false` `remember` behaves as before, and a new
      sign-in ends the kept sign-in the browser held.

      For a person with two-step sign-in on (spec 034), a right password answers `202`
      and only starts a pending sign-in, which lasts 5 minutes. The **Keep me signed
      in** choice is kept with it and applied when the second step completes.
    responses:
      '202':
        description: >-
          The password was right and a second step is due (spec 034): a code from the
          person's authenticator app or a recovery code. No session exists yet.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepRequired'
  POST /v1/auth/logout:
    description: |-
      Ends the session and this browser's kept sign-in, and forgets the `iot_kept`
      cookie. Kept sign-ins on other browsers stay.
  POST /v1/auth/reset-password:
    description: |-
      Sets the new password, signs the person out everywhere, revokes their agent
      connections and ends every kept sign-in they hold.
  POST /v1/auth/two-step:
    description: |-
      The second step of sign-in (spec 034). Send exactly one of `code` (six digits from
      the authenticator app) or `recovery_code`. A valid one starts the session, and the
      kept sign-in when **Keep me signed in** was ticked at the password step. A code
      that already signed the person in is refused for the rest of its window, and a
      recovery code works once. Five wrong codes, or 5 minutes, end the pending sign-in.
      Attempts count toward the same per-account and per-address limit as passwords.
    responses:
      '200':
        description: Signed in.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepSignedIn'
      '422':
        description: A wrong code, invalid input, or no pending sign-in.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepRefused'
  POST /v1/auth/confirm-password:
    description: |-
      Confirms the signed-in person's password (spec 034). Security changes answer `423`
      until this has been done in the last 15 minutes.
  GET /v1/me/security:
    description: |-
      The signed-in person's sign-in security (spec 034): whether two-step is on, how
      many recovery codes remain, and whether two-step is required for them.
    responses:
      '200':
        description: The person's security settings.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/SecuritySettings'
  POST /v1/me/two-step:
    description: |-
      Starts two-step setup, or restarts it with a new secret while it is unconfirmed.
      Needs a recently confirmed password.
    responses:
      '200':
        description: The setup secret.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepSetup'
      '409':
        $ref: '#/components/responses/TwoStepConflict'
      '423':
        $ref: '#/components/responses/PasswordConfirmationRequired'
  POST /v1/me/two-step/confirm:
    description: |-
      Confirms setup with a code from the authenticator app. Two-step is on from here:
      the response holds the recovery codes, shown only this once, and every other
      session and kept sign-in of the person ends.
    responses:
      '200':
        description: Two-step is on.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodes'
      '409':
        $ref: '#/components/responses/TwoStepConflict'
  POST /v1/me/two-step/recovery-codes:
    description: |-
      Replaces the recovery codes. Every earlier code stops working, and every other
      session and kept sign-in of the person ends. Needs a recently confirmed password.
    responses:
      '200':
        description: The new recovery codes, shown only this once.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCodes'
      '409':
        $ref: '#/components/responses/TwoStepConflict'
      '423':
        $ref: '#/components/responses/PasswordConfirmationRequired'
  DELETE /v1/me/two-step:
    description: |-
      Turns two-step off, or discards an unconfirmed setup. Turning it off ends every
      other session and kept sign-in of the person. Needs a recently confirmed password.
      Refused while two-step is required for the person (`409 two_step_required`).
    responses:
      '409':
        $ref: '#/components/responses/TwoStepConflict'
      '423':
        $ref: '#/components/responses/PasswordConfirmationRequired'
  PUT /v1/notifications/preferences:
    responses:
      '403':
        $ref: '#/components/responses/Forbidden'
      '409':
        $ref: '#/components/responses/Conflict'
  GET /v1/notifications/push:
    description: |-
      The person's push settings (spec 033): whether this deployment can push and the
      key browsers subscribe with, the switch and levels that apply across
      organizations, one switch per organization they can view devices in, and their
      devices. Endpoints and keys are never returned.
    responses:
      '200':
        description: The person's push settings.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PushSettings'
  PUT /v1/notifications/push:
    description: |-
      Saves the switch and the four levels (critical, warning, info, recovery). Stale
      `revision` gets 409; push has its own revision, separate from email's.
    responses:
      '200':
        description: The saved settings.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PushSettings'
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/notifications/push/organizations/{organization}:
    description: |-
      Turns one organization's pushes on or off for the person. 404 unless they are a
      member who can view devices there.
    responses:
      '200':
        description: The settings after the change.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PushSettings'
  POST /v1/notifications/push/devices:
    description: |-
      Registers this browser's push subscription, linked to the session and kept sign-in
      it came from. An endpoint another person held is released to the caller. A person
      has at most ten devices; an eleventh replaces the one unused longest and names it in
      `replaced`. The first device turns push on with the default levels. 409 when the
      deployment has no push key.
    responses:
      '200':
        description: The browser was already registered to this person; its links were refreshed.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PushDeviceRegistered'
      '201':
        description: The browser was registered.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/PushDeviceRegistered'
  POST /v1/notifications/push/devices/sync:
    description: |-
      Called at every portal start by a browser that holds a subscription: `mine`
      refreshes its links, `released` means another person's registration for it was
      removed, `unknown` means the server has none. For the last two the browser
      unsubscribes.
  DELETE /v1/notifications/push/devices/{device}:
    description: |-
      Removes one of the person's devices, ends the kept sign-in it was linked to and
      destroys its session, so that browser needs a password again.
  POST /v1/notifications/push/devices/{device}/test:
    description: |-
      Sends a test push to that device now: `accepted`, `gone` (the push service no
      longer knows it; the device is removed) or `failed`. Six a minute per person.
