      without one), in commit order, `limit` 1 to 100 (default 100). Pages skip events
      for devices not granted to the application, so save `next_cursor` even from an
      empty page. The feed is at least once: deduplicate by event `id`. Cursors are
      encrypted and bound to the organization, the application and its grant revision;
      a token rotation keeps them. Needs `events:read` and either `alerts:read` or
      `geofences:read`, each on both the application and the token. 409 after a grant
      change (rebuild from a fresh checkpoint); 422 for invalid input, an unreadable
      cursor or another application's cursor.
    x-abilities:
      all: [events:read]
      any_of: [[alerts:read, geofences:read]]
