# Dashboard operations.
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
components:
  schemas:
    DashboardRevisionSummary:
      type: object
      description: One saved version of a dashboard. The 50 most recent are kept.
      required: [revision, name, created_at, origin, widget_count, updated_by_name]
      properties:
        revision:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        origin:
          type: [string, 'null']
          enum: [assistant, agent, null]
          description: Who made the version when it was not a person alone; `assistant` for a proposal from the dashboard assistant (spec 019), `agent` reserved for agent drafts (spec 004). Null for a person's save.
        widget_count:
          type: integer
        updated_by_name:
          type: [string, 'null']
operations:
  GET /v1/organizations/{organization}/dashboards/{dashboard}/revisions:
    responses:
      '200':
        description: The dashboard's versions, newest first.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/DashboardRevisionSummary'
  POST /v1/organizations/{organization}/dashboards:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  PUT /v1/organizations/{organization}/dashboards/{dashboard}:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/organizations/{organization}/dashboards/{dashboard}/revisions/{number}/restore:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/dashboards/{dashboard}/archive:
    description: >-
      Hides the dashboard from lists and makes it read-only: saves, restoring a version
      and access changes then get 409. Needs the owner or `Dashboard.manage`. Archiving
      an archived dashboard changes nothing.
    responses:
      '200':
        description: The dashboard is archived.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: '2026-11-11T09:30:00+00:00'
                archived_by:
                  user_id: 42
                  name: Ana Silva
  POST /v1/organizations/{organization}/dashboards/{dashboard}/restore:
    description: >-
      Brings an archived dashboard back to the library as it was. Needs the owner or
      `Dashboard.manage`. Restoring a current dashboard changes nothing.
    responses:
      '200':
        description: The dashboard is current again.
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ArchiveState'
            example:
              data:
                uuid: 9b2f4c1e-5a7d-4e38-8f0a-2c6d1b3e4f50
                archived_at: null
                archived_by: null
  PUT /v1/organizations/{organization}/dashboards/{dashboard}/access:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
