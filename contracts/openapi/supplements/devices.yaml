# Devices operations.
#
# Statuses the code returns that inference missed, found by the response checks in
# the test suite (spec 001 PR 2, recorded in specs/001-openapi-contract/drift-log.md).
# Success bodies stay pending until the domain is described.
# Format: ../meta/supplement.schema.json.
operations:
  GET /v1/organizations/{organization}/bulk-onboardings/{run}:
    description: A bulk onboarding run (spec 026) with its counts and 100 items per page; pass `data.next_cursor` as `cursor` for the next page. An item reads `active` only once the runtime has acknowledged its device.
  POST /v1/organizations/{organization}/bulk-onboardings/{run}/retry:
    description: Re-queues the run's failed items. Skipped sources do not match the profile and need a new run.
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/device-onboardings:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PATCH /v1/organizations/{organization}/devices/{device}:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/devices/{device}/archive:
    responses:
      '422':
        $ref: '#/components/responses/Unprocessable'
  POST /v1/organizations/{organization}/devices/{device}/commands:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/devices/{device}/commands/send:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
      '503':
        $ref: '#/components/responses/RuntimeUnavailable'
  POST /v1/organizations/{organization}/devices/{device}/commands/{command}/confirm:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  PUT /v1/organizations/{organization}/devices/{device}/configuration:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/devices/{device}/connection-kit:
    responses:
      '422':
        $ref: '#/components/responses/Unprocessable'
      '503':
        $ref: '#/components/responses/ServiceUnavailable'
  POST /v1/organizations/{organization}/devices/{device}/lifecycle:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  GET /v1/organizations/{organization}/devices/{device}/measurements/history:
    responses:
      '503':
        $ref: '#/components/responses/RuntimeUnavailable'
  GET /v1/organizations/{organization}/devices/{device}/measurements/state-history:
    responses:
      '504':
        $ref: '#/components/responses/RangeTimeout'
  POST /v1/organizations/{organization}/devices/{device}/onboarding/provision:
    responses:
      '202':
        description: Provisioning started but has not finished; the body shows the setup as it is now. Call again to continue.
        content:
          application/json:
            schema: {}
  POST /v1/organizations/{organization}/devices/{device}/validate:
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  GET /v1/organizations/{organization}/discovery-candidates:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  GET /v1/organizations/{organization}/gateways:
    description: The organization's gateways, 100 per page at most. Each carries `sources_count`, the sources it has reported, and `devices_count`, the organization's devices configured from one of those sources in every lifecycle, archived included; the gateway's own devices list with `GET devices?gateway_uuid=`. Each also carries `adapter` (`uuid`, `name`) when it is a device adapter's publisher, the broker identity the adapter runtime publishes with, and null otherwise; people see the adapter in its place. `kind=gateway` lists only the gateways people run, `kind=adapter` only the adapters' publishers; both are listed without it.
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/organizations/{organization}/gateways/{gateway}/bulk-onboardings:
    description: Queues a bulk onboarding run over selected discovered sources of the gateway with one published profile revision (spec 026). Each source becomes a device with a generated name and code, the profile's suggested mappings and an activation request. Repeating the request with the same `operation_uuid` returns the same run.
    responses:
      '409':
        $ref: '#/components/responses/Conflict'
  POST /v1/organizations/{organization}/gateways/{gateway}/provision:
    responses:
      '503':
        $ref: '#/components/responses/ServiceUnavailable'
  POST /v1/organizations/{organization}/sites:
    responses:
      '422':
        $ref: '#/components/responses/ValidationFailed'
  POST /v1/organizations/{organization}/telemetry-captures/{capture}/diagnose:
    responses:
      '503':
        $ref: '#/components/responses/ServiceUnavailable'
