name: Release single-node images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      export_existing_run:
        description: Successful release run to export for private offline deployment (blank builds a release)
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.export_existing_run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, pcntl
      - run: composer install --no-interaction --prefer-dist
        working-directory: apps/api
      - name: Configure ephemeral test application key
        working-directory: apps/api
        shell: bash
        run: |
          test_key="$(php artisan key:generate --show)"
          echo "::add-mask::$test_key"
          printf 'APP_KEY=%s\n' "$test_key" >> "$GITHUB_ENV"
      - run: php artisan test --compact
        working-directory: apps/api
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iot-os/portal --filter @iot-os/admin --filter @iot-os/api-client typecheck
      - run: pip install PyYAML
      - run: python3 -m unittest discover -s tooling/release -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/runtime/go.mod
          cache-dependency-path: services/runtime/go.sum
      - run: go test ./...
        working-directory: services/runtime
      - name: Verify vendor decoder sandbox and live adapter protocol
        run: |
          npm ci --prefix services/adapters --ignore-scripts
          npm test --prefix services/adapters
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto mosquitto-clients
          npm install --no-save --prefix .local/adapter-tests node-red@4.1.13
          MOSQUITTO_BIN=mosquitto npm run test:integration --prefix services/adapters
      - name: Verify Mosquitto TLS, tenant ACLs and durable recovery
        run: |
          docker build -f deploy/docker/runtime/Dockerfile -t elwids-mosquitto-runtime:check .
          python3 tooling/release/verify_mosquitto.py
  images:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.export_existing_run == '' }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, key: API_IMAGE, file: deploy/docker/api/Dockerfile.release, target: api}
          - {name: api-web, key: API_WEB_IMAGE, file: deploy/docker/api/Dockerfile.release, target: api-web}
          - {name: portal, key: PORTAL_IMAGE, file: deploy/docker/portal/Dockerfile, target: ''}
          - {name: admin, key: ADMIN_IMAGE, file: deploy/docker/admin/Dockerfile, target: ''}
          - {name: runtime, key: RUNTIME_IMAGE, file: deploy/docker/runtime/Dockerfile, target: ''}
          - {name: simulator, key: SIMULATOR_IMAGE, file: deploy/docker/simulator/Dockerfile, target: ''}
          - {name: adapter-manager, key: ADAPTER_MANAGER_IMAGE, file: services/adapters/Dockerfile, target: manager}
          - {name: adapter-runtime, key: ADAPTER_RUNTIME_IMAGE, file: services/adapters/Dockerfile, target: tenant-runtime}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Record digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          KEY: ${{ matrix.key }}
        run: python3 -c 'import os,json;open("image.json","w").write(json.dumps({os.environ["KEY"]:os.environ["IMAGE"]}))'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image.json
  manifest:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.export_existing_run == '' }}
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - name: Assemble manifest
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          images = {}
          for path in pathlib.Path('images').glob('*/image.json'):
              images.update(json.loads(path.read_text()))
          assert len(images) == 8
          pathlib.Path('release.json').write_text(json.dumps({'format': 1, 'commit': os.environ['GITHUB_SHA'], 'images': images}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: single-node-release
          path: |
            release.json
            deploy/release/
            deploy/ansible/
            tooling/release/

  export-images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.export_existing_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - name: Require a successful release from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.export_existing_run }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .path == ".github/workflows/release.yml"' source-run.json
      - uses: actions/download-artifact@v4
        with:
          name: single-node-release
          path: validated-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.export_existing_run }}
      - name: Export immutable images with repository-scoped credentials
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          mkdir image-transfer
          cp validated-release/release.json image-transfer/release.json
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          manifest = json.loads(pathlib.Path('image-transfer/release.json').read_text())
          source = json.loads(pathlib.Path('source-run.json').read_text())
          assert manifest['commit'] == source['head_sha']
          expected = {'API_IMAGE', 'API_WEB_IMAGE', 'PORTAL_IMAGE', 'ADMIN_IMAGE', 'RUNTIME_IMAGE', 'SIMULATOR_IMAGE'}
          assert set(manifest['images']) in (expected, expected | {'ADAPTER_MANAGER_IMAGE', 'ADAPTER_RUNTIME_IMAGE'})
          prefix = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower() + '/'
          with open('image-list.tsv', 'w') as stream:
              for key, reference in sorted(manifest['images'].items()):
                  assert reference.startswith(prefix) and re.fullmatch(r'[a-z0-9./_-]+@sha256:[a-f0-9]{64}', reference)
                  stream.write(key + '\t' + reference + '\n')
          PYTHON
          while IFS=$'\t' read -r key reference; do
            skopeo copy --all --preserve-digests --src-creds "$REGISTRY_USER:$REGISTRY_TOKEN" "docker://$reference" "dir:image-transfer/$key"
          done < image-list.tsv
          tar -czf release-images.tar.gz image-transfer
          sha256sum release-images.tar.gz > release-images.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: single-node-image-transfer
          path: |
            release-images.tar.gz
            release-images.tar.gz.sha256
          retention-days: 3
          compression-level: 0
