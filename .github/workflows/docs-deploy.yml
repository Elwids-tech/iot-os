name: Docs deploy
# Publishes the platform's front door and developer docs (apps/docs) to GitHub Pages
# (spec 013, ADR-021). The generated reference comes from the commit the hosted
# service runs (the DOCS_HOSTED_REF secret), so docs never describe unreleased work.
# Runs only once the owner has set up Pages and the docs domain and set the
# DOCS_PAGES_ENABLED variable to "true" (docs/ops/docs-site.md).
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - contracts/**
      - apps/api/resources/help/**
      - packages/integration-sdk/**
      - packages/ui/**
      - tooling/simulators/**
      - pnpm-lock.yaml
      - .github/workflows/docs-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-deploy
  cancel-in-progress: false
jobs:
  build:
    name: Build the docs
    if: vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_DOCS_PRODUCT_NAME: ${{ vars.PUBLIC_DOCS_PRODUCT_NAME }}
      PUBLIC_DOCS_COMPANY_NAME: ${{ vars.PUBLIC_DOCS_COMPANY_NAME }}
      PUBLIC_DOCS_COMPANY_TAGLINE: ${{ vars.PUBLIC_DOCS_COMPANY_TAGLINE }}
      PUBLIC_DOCS_SITE_URL: ${{ vars.PUBLIC_DOCS_SITE_URL }}
      PUBLIC_DOCS_MARKETING_URL: ${{ vars.PUBLIC_DOCS_MARKETING_URL }}
      PUBLIC_DOCS_CONTACT_URL: ${{ vars.PUBLIC_DOCS_CONTACT_URL }}
      PUBLIC_DOCS_PORTAL_URL: ${{ vars.PUBLIC_DOCS_PORTAL_URL }}
      PUBLIC_DOCS_API_BASE_URL: ${{ vars.PUBLIC_DOCS_API_BASE_URL }}
      PUBLIC_DOCS_BROKER_HOST: ${{ vars.PUBLIC_DOCS_BROKER_HOST }}
      DOCS_HOSTED_REF: ${{ secrets.DOCS_HOSTED_REF }}
      DOCS_DENYLIST: ${{ secrets.DOCS_DENYLIST }}
      # A production build must check private names.
      DOCS_REQUIRE_DENYLIST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require the hosted commit
        run: |
          if [ -z "$DOCS_HOSTED_REF" ]; then
            echo "::error::Set the DOCS_HOSTED_REF secret to the commit the hosted service runs."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # sources + astro build + check-docs. A failure stops here, so the published
      # version stays online (FR-019).
      - run: pnpm --filter @iot-os/docs build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist
  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
