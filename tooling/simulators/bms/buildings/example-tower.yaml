      - {key: mode, name: Mode, kind: command, command: mode, type: state, states: ['Auto', 'Off', 'On'], default: 'Auto', brick: Mode_Command}
      - {key: supply_air_temperature_setpoint, name: Supply air temperature setpoint, kind: command, command: setpoint, type: number, unit: °C, limits: [10, 18], default: 13, brick: Supply_Air_Temperature_Setpoint}
