# Example Tower: the one definition of the simulated building (spec 038).
#
# The simulator, a 3D model and the expected entity hierarchy are all built from this
# file, so nothing else keeps its own copy. The plan in
# specs/038-opc-ua-connector/building.md explains it floor by floor; the totals there
# are checked against this file by tooling/simulators/test_bms_model.py.
#
# Coordinates are metres from the south-west corner of the building at ground level:
# x runs east, y runs north, z runs up. An equipment position `at: [x, y, z]` is the
# centre of its footprint, with z measured from its level's floor. Facing is a compass
# bearing in degrees (0 north, 90 east). Example Tower is invented.
#
# Plans describe a floor once. Inside a plan, keys are relative (`AHU-1` on level L03
# is `L03-AHU-1`); a reference that starts with a level key (`L10-OAU-1`) is absolute.
schema_version: bms-building.v1

site: {key: EC, name: Example Campus}

building:
  key: ET
  name: Example Tower
  namespace: urn:example:bms:example-tower
  timezone: UTC
  size: [48, 30]
  grid: 6
  core: [[15, 9], [33, 9], [33, 21], [15, 21]]

