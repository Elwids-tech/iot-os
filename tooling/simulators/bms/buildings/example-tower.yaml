# Which levels and equipment each --size option runs. `large` adds office floors above
# the plant floor, as a tall tower adds a second rise above a mid-height plant floor.
sizes:
  standard:
    levels: [L02, L03, L10, RF]
    equipment: [B1-MM-1]
  tower:
    levels: all
  large:
    levels: all
    add_office_levels: {from: 11, to: 32, plan: office, first_floor_z: 48.0, height: 4.0}
    move: {RF: {floor_z: 136.0}}

# Each equipment type's points. A type's `kind` is the key segment its equipment
# uses (`L03-AHU-1`); pumps take theirs from their role (PCHWP, CWP, HWP, BP).
# A point's kind: sensor, actuator, status, alarm, total, command.
# type: number, boolean, state (one of `states`), text. A command has `command:`
# setpoint, mode or request; a number command accepts `limits`, a state command its
# states. `default` is a command's value when the simulator starts. `at: wall` marks a
# point read by the zone's wall sensor, `at: ceiling` one read by its ceiling sensor.
library:
  air_handling_unit:
    name: Air handling unit
    kind: AHU
    footprint: [4.0, 2.0, 2.2]
    points:
      - {key: supply_air_temperature, name: Supply air temperature, kind: sensor, type: number, unit: °C, range: [5, 40], brick: Supply_Air_Temperature_Sensor}
      - {key: return_air_temperature, name: Return air temperature, kind: sensor, type: number, unit: °C, range: [10, 40], brick: Return_Air_Temperature_Sensor}
      - {key: mixed_air_temperature, name: Mixed air temperature, kind: sensor, type: number, unit: °C, range: [-20, 45], brick: Mixed_Air_Temperature_Sensor}
      - {key: return_air_co2, name: Return air carbon dioxide, kind: sensor, type: number, unit: ppm, range: [0, 2000], brick: Return_Air_CO2_Sensor}
      - {key: duct_static_pressure, name: Duct static pressure, kind: sensor, type: number, unit: Pa, range: [0, 1000], brick: Supply_Air_Static_Pressure_Sensor}
      - {key: filter_pressure_drop, name: Filter pressure drop, kind: sensor, type: number, unit: Pa, range: [0, 500], brick: Filter_Differential_Pressure_Sensor}
      - {key: supply_airflow, name: Supply airflow, kind: sensor, type: number, unit: L/s, range: [0, 30000], brick: Supply_Air_Flow_Sensor}
      - {key: supply_fan_speed, name: Supply fan speed, kind: actuator, type: number, unit: '%', range: [0, 100], brick: Speed_Status}
      - {key: return_fan_speed, name: Return fan speed, kind: actuator, type: number, unit: '%', range: [0, 100], brick: Speed_Status}
      - {key: cooling_valve, name: Cooling valve position, kind: actuator, type: number, unit: '%', range: [0, 100], brick: Valve_Position_Sensor}
      - {key: heating_valve, name: Heating valve position, kind: actuator, type: number, unit: '%', range: [0, 100], brick: Valve_Position_Sensor}
      - {key: outdoor_air_damper, name: Outdoor air damper position, kind: actuator, type: number, unit: '%', range: [0, 100], brick: Damper_Position_Sensor}
      - {key: supply_fan_status, name: Supply fan status, kind: status, type: boolean, brick: Fan_Status}
      - {key: return_fan_status, name: Return fan status, kind: status, type: boolean, brick: Fan_Status}
      - {key: operating_state, name: Operating state, kind: status, type: state, states: ['Off', 'Occupied', 'Unoccupied', 'Warm-up', 'Night purge', 'Hand', 'Shut down']}
      - {key: supply_fan_fault, name: Supply fan fault, kind: alarm, type: boolean, brick: Fault_Status}
